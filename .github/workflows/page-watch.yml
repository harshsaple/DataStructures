name: page-watch

on:
  schedule:
    - cron: "3-58/5 * * * *"  # every 5 min, offset from the busy top of the hour
  workflow_dispatch:         # manual run from the Actions tab

concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: tools/page-watch
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/page-watch
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/page-watch/last_alert.txt
            tools/page-watch/health.json
          key: page-watch-${{ github.run_id }}
          restore-keys: page-watch-
      - name: Run check
        env:
          CONFIG: ${{ secrets.CONFIG }}
          KINDS: b
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          CLICK_URL: ${{ secrets.CLICK_URL }}
          SECTIONS: ${{ secrets.SECTIONS }}
          LABELS: ${{ secrets.LABELS }}
          NAMES: ${{ secrets.NAMES }}
        run: python3 check.py
      - name: Save state
        if: always() && (hashFiles('tools/page-watch/last_alert.txt') != '' || hashFiles('tools/page-watch/health.json') != '')
        uses: actions/cache/save@v4
        with:
          path: |
            tools/page-watch/last_alert.txt
            tools/page-watch/health.json
          key: page-watch-${{ github.run_id }}
